[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "Desktop dashboard for local Codex agents, sessions, repositories, and pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Flpvoigt" },
  { name = "GustavoLoes", email = "gustavoloes7@gmail.com" },
]
dependencies = ["pywebview>=6.2,<7"]

[project.scripts]
agent-workbench = "agent_workbench.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workbench = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

